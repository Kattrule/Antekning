<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anteckning</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- jsQR (Skanna QR från bild) -->
    <script src="https://cdn.jsdelivr.net/npm/jsQR@1.4.0/dist/jsQR.js"></script>
    <!-- LZ-String (Kompression för att få plats med mycket data i QR) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f111a;
            --card-bg: rgba(22, 26, 39, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-neon: #00f2fe;
            --secondary-neon: #4facfe;
            --accent-pink: #ff0844;
            --accent-purple: #b224ef;
            --text-main: #f0f3f8;
            --text-muted: #8c9ba5;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(178, 36, 239, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        #app {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        aside {
            width: 300px;
            background: rgba(13, 15, 23, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            z-index: 20;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 24px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-neon), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-new-note {
            margin: 20px;
            padding: 12px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #000;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
            transition: all 0.2s;
        }

        .btn-new-note:hover {
            transform: translateY(-2px);
        }

        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 20px;
        }

        .note-item {
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: var(--radius-md);
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .note-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .note-item.active {
            background: rgba(0, 242, 254, 0.08);
            border-color: rgba(0, 242, 254, 0.3);
        }

        .note-item-title {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .note-item-delete {
            opacity: 0.7;
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }

        .note-item-delete:hover {
            opacity: 1;
            color: var(--accent-pink);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 17, 26, 0.6);
            backdrop-filter: blur(10px);
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .btn-menu-toggle {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 1.1rem;
        }

        .note-title-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.4rem;
            font-weight: 700;
            outline: none;
            width: 100%;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mode-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            padding: 3px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
        }

        .mode-btn {
            padding: 6px 12px;
            border-radius: 20px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            color: #000;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .editor-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
        }

        .blocks-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .block-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
        }

        .block-item.disabled {
            opacity: 0.5;
            background: rgba(10, 12, 18, 0.5);
        }

        .block-item.disabled .block-text-input {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .checkbox-wrapper input {
            display: none;
        }

        .custom-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .checkbox-wrapper input:checked + .custom-checkbox {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            border-color: transparent;
        }

        .custom-checkbox i {
            color: #fff;
            font-size: 0.75rem;
            display: none;
        }

        .checkbox-wrapper input:checked + .custom-checkbox i {
            display: block;
        }

        .block-text-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .block-view-text {
            flex: 1;
            font-size: 1rem;
            color: var(--text-main);
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .block-view-text.has-link {
            cursor: pointer;
            color: var(--primary-neon);
        }

        .block-view-text.has-link:hover {
            text-decoration: underline;
        }

        .block-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-block-action {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-block-action.active-link {
            color: var(--primary-neon);
        }

        .btn-add-block {
            margin-top: 16px;
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed var(--card-border);
            border-radius: var(--radius-lg);
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .modal-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #161a27;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 90%;
            max-width: 440px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
        }

        .modal-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 12px;
            color: var(--text-main);
            outline: none;
            margin-bottom: 16px;
        }

        .qr-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 16px 0;
            background: #fff;
            padding: 16px;
            border-radius: var(--radius-md);
            min-height: 220px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            gap: 16px;
            text-align: center;
        }

        @media (max-width: 768px) {
            aside {
                position: absolute;
                top: 0; left: 0; bottom: 0;
                transform: translateX(-100%);
            }
            aside.mobile-open {
                transform: translateX(0);
            }
            .btn-menu-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-note-sticky"></i>
                    <span>Anteckningar</span>
                </div>
                <button class="btn-block-action" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <button class="btn-new-note" onclick="createNewNote()"><i class="fa-solid fa-plus"></i> Ny Anteckning</button>
            <div class="notes-list" id="notesList"></div>
        </aside>

        <main>
            <header>
                <div class="header-left">
                    <button class="btn-menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                    <input type="text" id="noteTitle" class="note-title-input" placeholder="Anteckningens titel..." oninput="updateNoteTitle(this.value)">
                </div>

                <div class="toolbar">
                    <button class="btn-icon" onclick="exportBackup()" title="Exportera JSON"><i class="fa-solid fa-download"></i></button>
                    <button class="btn-icon" onclick="document.getElementById('importFileInput').click()" title="Importera JSON"><i class="fa-solid fa-upload"></i></button>
                    <input type="file" id="importFileInput" style="display:none" accept=".json" onchange="importBackup(event)">

                    <button class="btn-icon" onclick="document.getElementById('qrFileInput').click()" title="Läs QR-bild" style="color: var(--primary-neon);"><i class="fa-solid fa-qrcode"></i> Läs QR-bild</button>
                    <input type="file" id="qrFileInput" style="display:none" accept="image/*" onchange="importFromQRImage(event)">

                    <div class="mode-toggle">
                        <button class="mode-btn active" id="btnModeEdit" onclick="setMode('edit')"><i class="fa-solid fa-pen"></i> Redigera</button>
                        <button class="mode-btn" id="btnModeView" onclick="setMode('view')"><i class="fa-solid fa-eye"></i> Visa</button>
                    </div>

                    <button class="btn-icon" onclick="openShareModal()"><i class="fa-solid fa-share-nodes"></i> Dela</button>
                </div>
            </header>

            <div class="editor-area">
                <div id="blocksContainer" class="blocks-container"></div>
                <button class="btn-add-block" id="btnAddBlock" onclick="addBlock()"><i class="fa-solid fa-plus"></i> Lägg till nytt block</button>
            </div>
        </main>
    </div>

    <!-- Link Modal -->
    <div class="modal-overlay" id="linkModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Koppla länk</h3>
                <button class="modal-close" onclick="closeModal('linkModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <input type="url" id="linkInput" class="modal-input" placeholder="https://exempel.se">
            <div style="display:flex; justify-content:flex-end; gap:8px;">
                <button class="btn-icon" onclick="removeBlockLink()" style="color:var(--accent-pink);">Ta bort länk</button>
                <button class="btn-icon" onclick="saveBlockLink()" style="background:var(--primary-neon); color:#000;">Spara</button>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div class="modal-overlay" id="shareModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Dela via QR-bild</h3>
                <button class="modal-close" onclick="closeModal('shareModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div style="margin-bottom:12px;">
                <label style="font-size:0.85rem; color:var(--text-muted); display:block; margin-bottom:4px;">Behörighet</label>
                <select id="sharePermission" class="modal-input" style="margin-bottom:0;" onchange="generateQRShare()">
                    <option value="edit">Kan redigera</option>
                    <option value="view">Endast visa</option>
                </select>
            </div>

            <div style="text-align:center;">
                <div class="qr-container"><div id="qrcode"></div></div>
                <button class="btn-icon" onclick="downloadQRCode()" style="width:100%; justify-content:center; background: var(--primary-neon); color: #000; font-weight:600;"><i class="fa-solid fa-file-arrow-down"></i> Spara QR-bild</button>
            </div>
        </div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('notepad_pro_data') || '[]');
        let activeNoteId = notes[0]?.id || null;
        let currentMode = 'edit';
        let currentEditingBlockId = null;

        window.addEventListener('DOMContentLoaded', () => {
            renderNotesList();
            renderActiveNote();
        });

        const toggleSidebar = () => document.getElementById('sidebar').classList.toggle('mobile-open');
        const save = () => localStorage.setItem('notepad_pro_data', JSON.stringify(notes));
        const getActiveNote = () => notes.find(n => n.id === activeNoteId);

        function renderNotesList() {
            const listEl = document.getElementById('notesList');
            listEl.innerHTML = '';
            notes.forEach(note => {
                const item = document.createElement('div');
                item.className = `note-item ${note.id === activeNoteId ? 'active' : ''}`;
                item.onclick = () => { selectNote(note.id); };
                item.innerHTML = `
                    <span class="note-item-title">${escapeHtml(note.title || 'Namnlös')}</span>
                    <button class="note-item-delete" onclick="deleteNote(event, '${note.id}')"><i class="fa-solid fa-trash"></i></button>
                `;
                listEl.appendChild(item);
            });
        }

        function selectNote(id) {
            activeNoteId = id;
            document.getElementById('sidebar').classList.remove('mobile-open');
            renderNotesList();
            renderActiveNote();
        }

        function createNewNote() {
            const newNote = { id: 'n_' + Date.now(), title: '', blocks: [{ id: 'b_' + Date.now(), text: '', checked: false, url: '' }] };
            notes.unshift(newNote);
            activeNoteId = newNote.id;
            save();
            renderNotesList();
            renderActiveNote();
            setMode('edit');
        }

        function deleteNote(e, id) {
            e.stopPropagation();
            if (confirm('Ta bort anteckning?')) {
                notes = notes.filter(n => n.id !== id);
                activeNoteId = notes[0]?.id || null;
                save();
                renderNotesList();
                renderActiveNote();
            }
        }

        function renderActiveNote() {
            const note = getActiveNote();
            const container = document.getElementById('blocksContainer');
            const titleInput = document.getElementById('noteTitle');
            const btnAddBlock = document.getElementById('btnAddBlock');

            if (!note) {
                titleInput.value = '';
                titleInput.disabled = true;
                container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-note-sticky" style="font-size:3rem;"></i><p>Ingen anteckning vald.</p></div>`;
                btnAddBlock.style.display = 'none';
                return;
            }

            titleInput.disabled = (currentMode === 'view');
            titleInput.value = note.title;
            btnAddBlock.style.display = (currentMode === 'edit') ? 'flex' : 'none';
            container.innerHTML = '';

            const blocksToRender = note.blocks.filter(b => !(currentMode === 'view' && b.checked));

            blocksToRender.forEach(block => {
                const blockEl = document.createElement('div');
                blockEl.className = `block-item ${block.checked ? 'disabled' : ''}`;

                if (currentMode === 'edit') {
                    blockEl.innerHTML = `
                        <label class="checkbox-wrapper">
                            <input type="checkbox" ${block.checked ? 'checked' : ''} onchange="toggleCheck('${block.id}', this.checked)">
                            <div class="custom-checkbox"><i class="fa-solid fa-check"></i></div>
                        </label>
                        <input type="text" class="block-text-input" value="${escapeHtml(block.text)}" placeholder="Skriv text..." oninput="updateText('${block.id}', this.value)">
                        <div class="block-controls">
                            <button class="btn-block-action ${block.url ? 'active-link' : ''}" onclick="openLinkModal('${block.id}')"><i class="fa-solid fa-link"></i></button>
                            <button class="btn-block-action" onclick="moveBlock('${block.id}', -1)"><i class="fa-solid fa-arrow-up"></i></button>
                            <button class="btn-block-action" onclick="moveBlock('${block.id}', 1)"><i class="fa-solid fa-arrow-down"></i></button>
                            <button class="btn-block-action" onclick="deleteBlock('${block.id}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                } else {
                    const hasLink = Boolean(block.url);
                    blockEl.innerHTML = `
                        <div class="block-view-text ${hasLink ? 'has-link' : ''}" onclick="if('${block.url}') window.open(/^https?:\\/\\//i.test('${block.url}') ? '${block.url}' : 'https://${block.url}', '_blank')">
                            <span>${escapeHtml(block.text) || '<i>Tom rad</i>'}</span>
                            ${hasLink ? '<i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.8rem;"></i>' : ''}
                        </div>
                    `;
                }
                container.appendChild(blockEl);
            });
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnModeEdit').classList.toggle('active', mode === 'edit');
            document.getElementById('btnModeView').classList.toggle('active', mode === 'view');
            renderActiveNote();
        }

        function updateNoteTitle(v) {
            const n = getActiveNote();
            if (n) { n.title = v; save(); renderNotesList(); }
        }

        function addBlock() {
            const n = getActiveNote();
            if (n) {
                n.blocks.push({ id: 'b_' + Date.now(), text: '', checked: false, url: '' });
                save();
                renderActiveNote();
            }
        }

        function updateText(id, text) {
            const n = getActiveNote();
            const b = n?.blocks.find(x => x.id === id);
            if (b) { b.text = text; save(); }
        }

        function toggleCheck(id, checked) {
            const n = getActiveNote();
            const b = n?.blocks.find(x => x.id === id);
            if (b) { b.checked = checked; save(); renderActiveNote(); }
        }

        function moveBlock(id, dir) {
            const n = getActiveNote();
            if (!n) return;
            const idx = n.blocks.findIndex(x => x.id === id);
            const newIdx = idx + dir;
            if (newIdx >= 0 && newIdx < n.blocks.length) {
                const temp = n.blocks[idx];
                n.blocks[idx] = n.blocks[newIdx];
                n.blocks[newIdx] = temp;
                save();
                renderActiveNote();
            }
        }

        function deleteBlock(id) {
            const n = getActiveNote();
            if (n) {
                n.blocks = n.blocks.filter(x => x.id !== id);
                save();
                renderActiveNote();
            }
        }

        function openLinkModal(id) {
            currentEditingBlockId = id;
            const n = getActiveNote();
            const b = n?.blocks.find(x => x.id === id);
            document.getElementById('linkInput').value = b?.url || '';
            document.getElementById('linkModal').classList.add('open');
        }

        function saveBlockLink() {
            const url = document.getElementById('linkInput').value.trim();
            const n = getActiveNote();
            const b = n?.blocks.find(x => x.id === currentEditingBlockId);
            if (b) { b.url = url; save(); renderActiveNote(); }
            closeModal('linkModal');
        }

        function removeBlockLink() {
            document.getElementById('linkInput').value = '';
            saveBlockLink();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('open');
        }

        function openShareModal() {
            if (getActiveNote()) {
                document.getElementById('shareModal').classList.add('open');
                generateQRShare();
            }
        }

        function generateQRShare() {
            const n = getActiveNote();
            if (!n) return;

            const perm = document.getElementById('sharePermission').value;
            const payload = {
                t: n.title,
                b: n.blocks.map(b => [b.text, b.checked ? 1 : 0, b.url || ""]),
                r: perm === 'view' ? 1 : 0
            };

            // Compress payload into a compact string using LZString
            const compressed = LZString.compressToEncodedURIComponent(JSON.stringify(payload));
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';

            new QRCode(qrContainer, {
                text: compressed,
                width: 220,
                height: 220,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.L
            });
        }

        function downloadQRCode() {
            const canvas = document.querySelector('#qrcode canvas');
            const img = document.querySelector('#qrcode img');
            const src = canvas ? canvas.toDataURL('image/png') : (img ? img.src : '');
            if (src) {
                const a = document.createElement('a');
                a.href = src;
                a.download = `anteckning_qr_${Date.now()}.png`;
                a.click();
            }
        }

        function importFromQRImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code && code.data) {
                        try {
                            // Decompress data using LZString (falls back to uncompressed JSON if needed)
                            let jsonStr = LZString.decompressFromEncodedURIComponent(code.data);
                            if (!jsonStr) jsonStr = code.data;
                            
                            const data = JSON.parse(jsonStr);
                            if (data.t !== undefined && Array.isArray(data.b)) {
                                const newNote = {
                                    id: 'n_' + Date.now(),
                                    title: data.t,
                                    blocks: data.b.map(item => ({
                                        id: 'b_' + Math.random().toString(36).substr(2, 9),
                                        text: item[0],
                                        checked: Boolean(item[1]),
                                        url: item[2] || ""
                                    }))
                                };
                                notes.unshift(newNote);
                                activeNoteId = newNote.id;
                                save();
                                renderNotesList();
                                renderActiveNote();
                                if (data.r === 1) setMode('view');
                                alert('Anteckning inläst från QR-bild!');
                            } else {
                                alert('Bilden innehöll inte en giltig antecknings-QR.');
                            }
                        } catch(err) {
                            alert('Kunde inte läsa anteckningsdatan i QR-koden.');
                        }
                    } else {
                        alert('Ingen QR-kod hittades i bilden.');
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function exportBackup() {
            const a = document.createElement('a');
            a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(notes, null, 2));
            a.download = `anteckningar_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function importBackup(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const parsed = JSON.parse(evt.target.result);
                    if (Array.isArray(parsed)) {
                        notes = parsed;
                        activeNoteId = notes[0]?.id || null;
                        save();
                        renderNotesList();
                        renderActiveNote();
                        alert('Backup importerad!');
                    }
                } catch(err) {
                    alert('Felaktig fil.');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function escapeHtml(t) {
            if (!t) return '';
            return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
