<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antecknin</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Outfit) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f111a;
            --card-bg: rgba(22, 26, 39, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-neon: #00f2fe;
            --secondary-neon: #4facfe;
            --accent-pink: #ff0844;
            --accent-purple: #b224ef;
            --accent-green: #00e676;
            --text-main: #f0f3f8;
            --text-muted: #8c9ba5;
            --disabled-color: #4a5568;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(178, 36, 239, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        #app {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        aside {
            width: 300px;
            background: rgba(13, 15, 23, 0.85);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 24px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-neon), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-new-note {
            margin: 20px;
            padding: 12px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #000;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
            transition: all 0.2s;
        }

        .btn-new-note:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.3);
        }

        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 20px;
        }

        .note-item {
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: var(--radius-md);
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .note-item:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .note-item.active {
            background: rgba(0, 242, 254, 0.08);
            border-color: rgba(0, 242, 254, 0.3);
        }

        .note-item-title {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .note-item-delete {
            opacity: 0;
            color: var(--text-muted);
            transition: opacity 0.2s, color 0.2s;
            background: none;
            border: none;
            cursor: pointer;
        }

        .note-item:hover .note-item-delete {
            opacity: 1;
        }

        .note-item-delete:hover {
            color: var(--accent-pink);
        }

        /* Main Content Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        header {
            padding: 16px 32px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 17, 26, 0.6);
            backdrop-filter: blur(10px);
            gap: 16px;
            flex-wrap: wrap;
        }

        .title-container {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .note-title-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 700;
            outline: none;
            width: 100%;
        }

        .note-title-input::placeholder {
            color: var(--text-muted);
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Mode Toggle Switch */
        .mode-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
        }

        .mode-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            color: #000;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .editor-area {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
        }

        /* Blocks Container */
        .blocks-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .block-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            position: relative;
        }

        .block-item:hover {
            border-color: rgba(0, 242, 254, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        /* Disabled Block State */
        .block-item.disabled {
            opacity: 0.5;
            background: rgba(10, 12, 18, 0.5);
            border-color: transparent;
        }

        .block-item.disabled .block-text-input,
        .block-item.disabled .block-view-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        /* Custom Checkbox */
        .checkbox-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .checkbox-wrapper input {
            display: none;
        }

        .custom-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .checkbox-wrapper input:checked + .custom-checkbox {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            border-color: transparent;
        }

        .custom-checkbox i {
            color: #fff;
            font-size: 0.75rem;
            display: none;
        }

        .checkbox-wrapper input:checked + .custom-checkbox i {
            display: block;
        }

        /* Input vs View Modes */
        .block-text-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            padding: 4px 0;
        }

        .block-view-text {
            flex: 1;
            font-size: 1rem;
            color: var(--text-main);
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .block-view-text.has-link {
            cursor: pointer;
            color: var(--primary-neon);
        }

        .block-view-text.has-link:hover {
            text-decoration: underline;
        }

        .link-indicator {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .block-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-block-action {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-block-action:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .btn-block-action.active-link {
            color: var(--primary-neon);
        }

        /* Add Block Button */
        .btn-add-block {
            margin-top: 16px;
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed var(--card-border);
            border-radius: var(--radius-lg);
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-add-block:hover {
            background: rgba(0, 242, 254, 0.05);
            border-color: rgba(0, 242, 254, 0.3);
            color: var(--primary-neon);
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #161a27;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
        }

        .modal-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 12px;
            color: var(--text-main);
            outline: none;
            margin-bottom: 16px;
        }

        .modal-input:focus {
            border-color: var(--primary-neon);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 16px 0;
            background: #fff;
            padding: 16px;
            border-radius: var(--radius-md);
        }

        .share-option {
            margin-bottom: 16px;
        }

        .share-option label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .permission-select {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: var(--radius-md);
            outline: none;
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            gap: 16px;
            text-align: center;
        }

        .empty-state i {
            font-size: 3rem;
            opacity: 0.3;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            #app {
                flex-direction: column;
            }

            aside {
                width: 100%;
                height: 60px;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 0 16px;
            }

            .sidebar-header {
                padding: 0;
                border: none;
            }

            .btn-new-note {
                margin: 0;
                padding: 8px 12px;
            }

            .notes-list {
                display: none; /* Can be toggled in mobile drawer if expanded */
            }

            header {
                padding: 12px 16px;
            }

            .editor-area {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- Sidebar Navigation -->
        <aside>
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-note-sticky"></i>
                    <span>Anteckningar Pro</span>
                </div>
            </div>
            <button class="btn-new-note" onclick="createNewNote()">
                <i class="fa-solid fa-plus"></i> Ny Anteckning
            </button>
            <div class="notes-list" id="notesList">
                <!-- Notes items will be rendered here -->
            </div>
        </aside>

        <!-- Main Workspace -->
        <main>
            <header>
                <div class="title-container">
                    <input type="text" id="noteTitle" class="note-title-input" placeholder="Anteckningens titel..." oninput="updateNoteTitle(this.value)">
                </div>

                <div class="toolbar">
                    <!-- Backup buttons -->
                    <button class="btn-icon" onclick="exportBackup()" title="Exportera Backup">
                        <i class="fa-solid fa-download"></i>
                    </button>
                    <button class="btn-icon" onclick="document.getElementById('importFileInput').click()" title="Importera Backup">
                        <i class="fa-solid fa-upload"></i>
                    </button>
                    <input type="file" id="importFileInput" style="display:none" accept=".json" onchange="importBackup(event)">

                    <!-- Mode Switch -->
                    <div class="mode-toggle">
                        <button class="mode-btn active" id="btnModeEdit" onclick="setMode('edit')">
                            <i class="fa-solid fa-pen"></i> Redigera
                        </button>
                        <button class="mode-btn" id="btnModeView" onclick="setMode('view')">
                            <i class="fa-solid fa-eye"></i> Visa
                        </button>
                    </div>

                    <!-- Share Button -->
                    <button class="btn-icon" onclick="openShareModal()">
                        <i class="fa-solid fa-share-nodes"></i> Dela
                    </button>
                </div>
            </header>

            <div class="editor-area" id="editorArea">
                <div id="blocksContainer" class="blocks-container">
                    <!-- Blocks rendered dynamically -->
                </div>

                <button class="btn-add-block" id="btnAddBlock" onclick="addBlock()">
                    <i class="fa-solid fa-plus"></i> Lägg till nytt block
                </button>
            </div>
        </main>
    </div>

    <!-- Link Modal -->
    <div class="modal-overlay" id="linkModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Koppla länk till block</div>
                <button class="modal-close" onclick="closeModal('linkModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <input type="url" id="linkInput" class="modal-input" placeholder="https://exempel.se">
            <div class="modal-actions">
                <button class="btn-icon" onclick="removeBlockLink()" style="color: var(--accent-pink);">Ta bort länk</button>
                <button class="btn-icon" onclick="saveBlockLink()" style="background: var(--primary-neon); color:#000; border:none;">Spara</button>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div class="modal-overlay" id="shareModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Dela anteckning</div>
                <button class="modal-close" onclick="closeModal('shareModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="share-option">
                <label>Behörighet för länken</label>
                <select id="sharePermission" class="permission-select" onchange="generateShareUrl()">
                    <option value="view">Endast visa (skrivskyddad)</option>
                    <option value="edit">Kan redigera</option>
                </select>
            </div>

            <div class="share-option">
                <label>Kort delningslänk</label>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="shareUrlInput" class="modal-input" readonly style="margin-bottom:0;">
                    <button class="btn-icon" onclick="copyShareUrl()" title="Kopiera länk"><i class="fa-solid fa-copy"></i></button>
                </div>
            </div>

            <div class="share-option" style="text-align: center;">
                <label>QR-kod för snabb skanning</label>
                <div class="qr-container">
                    <div id="qrcode"></div>
                </div>
                <button class="btn-icon" onclick="downloadQRCode()" style="margin: 0 auto; width: 100%; justify-content: center;">
                    <i class="fa-solid fa-file-arrow-down"></i> Ladda ner QR-kod
                </button>
            </div>
        </div>
    </div>

    <script>
        // Data State
        let notes = [];
        let activeNoteId = null;
        let currentMode = 'edit'; // 'edit' or 'view'
        let currentEditingBlockId = null;

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            checkUrlParams();
            
            if (!activeNoteId && notes.length > 0) {
                activeNoteId = notes[0].id;
            }
            
            renderNotesList();
            renderActiveNote();
        });

        // Local Storage Helpers
        function saveToLocalStorage() {
            localStorage.setItem('notepad_pro_data', JSON.stringify(notes));
        }

        function loadFromLocalStorage() {
            const data = localStorage.getItem('notepad_pro_data');
            if (data) {
                try {
                    notes = JSON.parse(data);
                } catch(e) {
                    notes = [];
                }
            } else {
                notes = [];
            }
        }

        // Check if loading shared link
        function checkUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const sharedData = urlParams.get('shared');
            if (sharedData) {
                try {
                    const decoded = JSON.parse(atob(sharedData));
                    const newNote = {
                        id: 'shared_' + Date.now(),
                        title: decoded.title || 'Delad Anteckning',
                        blocks: decoded.blocks || [],
                        readOnly: decoded.readOnly || false
                    };
                    notes.unshift(newNote);
                    activeNoteId = newNote.id;
                    saveToLocalStorage();
                    if(decoded.readOnly) {
                        setMode('view');
                    }
                } catch(e) {
                    console.error('Kunde inte läsa delad länk', e);
                }
            }
        }

        // Render Sidebar Notes List
        function renderNotesList() {
            const listEl = document.getElementById('notesList');
            listEl.innerHTML = '';

            notes.forEach(note => {
                const item = document.createElement('div');
                item.className = `note-item ${note.id === activeNoteId ? 'active' : ''}`;
                item.onclick = () => selectNote(note.id);

                item.innerHTML = `
                    <span class="note-item-title">${escapeHtml(note.title || 'Namnlös anteckning')}</span>
                    <button class="note-item-delete" onclick="deleteNote(event, '${note.id}')" title="Ta bort">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                listEl.appendChild(item);
            });
        }

        // Select & Create Notes
        function selectNote(id) {
            activeNoteId = id;
            renderNotesList();
            renderActiveNote();
        }

        function createNewNote() {
            const newNote = {
                id: 'n_' + Date.now(),
                title: '',
                blocks: [
                    { id: 'b_' + Date.now(), text: '', checked: false, url: '' }
                ]
            };
            notes.unshift(newNote);
            activeNoteId = newNote.id;
            saveToLocalStorage();
            renderNotesList();
            renderActiveNote();
            setMode('edit');
        }

        function deleteNote(e, id) {
            e.stopPropagation();
            if (confirm('Vill du verkligen ta bort denna anteckning?')) {
                notes = notes.filter(n => n.id !== id);
                if (activeNoteId === id) {
                    activeNoteId = notes.length > 0 ? notes[0].id : null;
                }
                saveToLocalStorage();
                renderNotesList();
                renderActiveNote();
            }
        }

        // Active Note Render
        function getActiveNote() {
            return notes.find(n => n.id === activeNoteId);
        }

        function renderActiveNote() {
            const note = getActiveNote();
            const container = document.getElementById('blocksContainer');
            const titleInput = document.getElementById('noteTitle');
            const btnAddBlock = document.getElementById('btnAddBlock');

            if (!note) {
                titleInput.value = '';
                titleInput.disabled = true;
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-note-sticky"></i>
                        <p>Ingen anteckning vald. Skapa en ny för att komma igång!</p>
                    </div>
                `;
                btnAddBlock.style.display = 'none';
                return;
            }

            titleInput.disabled = (currentMode === 'view');
            titleInput.value = note.title;
            btnAddBlock.style.display = (currentMode === 'edit') ? 'flex' : 'none';

            container.innerHTML = '';

            // Filter out disabled blocks in view mode
            const blocksToRender = note.blocks.filter(block => {
                if (currentMode === 'view' && block.checked) {
                    return false; // Hide checked/disabled blocks in view mode
                }
                return true;
            });

            if (blocksToRender.length === 0 && currentMode === 'view') {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-check-circle"></i>
                        <p>Alla block är avklarade/avaktiverade!</p>
                    </div>
                `;
                return;
            }

            blocksToRender.forEach((block, index) => {
                const blockEl = document.createElement('div');
                blockEl.className = `block-item ${block.checked ? 'disabled' : ''}`;

                if (currentMode === 'edit') {
                    blockEl.innerHTML = `
                        <label class="checkbox-wrapper">
                            <input type="checkbox" ${block.checked ? 'checked' : ''} onchange="toggleBlockCheck('${block.id}', this.checked)">
                            <div class="custom-checkbox"><i class="fa-solid fa-check"></i></div>
                        </label>
                        <input type="text" class="block-text-input" value="${escapeHtml(block.text)}" placeholder="Skriv något här..." oninput="updateBlockText('${block.id}', this.value)">
                        <div class="block-controls">
                            <button class="btn-block-action ${block.url ? 'active-link' : ''}" onclick="openLinkModal('${block.id}')" title="Koppla Länk">
                                <i class="fa-solid fa-link"></i>
                            </button>
                            <button class="btn-block-action" onclick="moveBlock('${block.id}', -1)" title="Flytta upp"><i class="fa-solid fa-arrow-up"></i></button>
                            <button class="btn-block-action" onclick="moveBlock('${block.id}', 1)" title="Flytta ner"><i class="fa-solid fa-arrow-down"></i></button>
                            <button class="btn-block-action" onclick="deleteBlock('${block.id}')" title="Ta bort block"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                } else {
                    // View Mode
                    const hasLink = Boolean(block.url);
                    blockEl.innerHTML = `
                        <div class="block-view-text ${hasLink ? 'has-link' : ''}" onclick="handleBlockClick('${block.url}')">
                            <span>${escapeHtml(block.text) || '<i>Tomt block</i>'}</span>
                            ${hasLink ? '<i class="fa-solid fa-arrow-up-right-from-square link-indicator"></i>' : ''}
                        </div>
                    `;
                }

                container.appendChild(blockEl);
            });
        }

        // Mode Switching
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnModeEdit').classList.toggle('active', mode === 'edit');
            document.getElementById('btnModeView').classList.toggle('active', mode === 'view');
            renderActiveNote();
        }

        // Block & Note Operations
        function updateNoteTitle(value) {
            const note = getActiveNote();
            if (note) {
                note.title = value;
                saveToLocalStorage();
                renderNotesList();
            }
        }

        function addBlock() {
            const note = getActiveNote();
            if (note) {
                note.blocks.push({
                    id: 'b_' + Date.now(),
                    text: '',
                    checked: false,
                    url: ''
                });
                saveToLocalStorage();
                renderActiveNote();
            }
        }

        function updateBlockText(blockId, text) {
            const note = getActiveNote();
            if (note) {
                const block = note.blocks.find(b => b.id === blockId);
                if (block) {
                    block.text = text;
                    saveToLocalStorage();
                }
            }
        }

        function toggleBlockCheck(blockId, checked) {
            const note = getActiveNote();
            if (note) {
                const block = note.blocks.find(b => b.id === blockId);
                if (block) {
                    block.checked = checked;
                    saveToLocalStorage();
                    renderActiveNote();
                }
            }
        }

        function moveBlock(blockId, direction) {
            const note = getActiveNote();
            if (note) {
                const index = note.blocks.findIndex(b => b.id === blockId);
                if (index < 0) return;
                const newIndex = index + direction;
                if (newIndex >= 0 && newIndex < note.blocks.length) {
                    const temp = note.blocks[index];
                    note.blocks[index] = note.blocks[newIndex];
                    note.blocks[newIndex] = temp;
                    saveToLocalStorage();
                    renderActiveNote();
                }
            }
        }

        function deleteBlock(blockId) {
            const note = getActiveNote();
            if (note) {
                note.blocks = note.blocks.filter(b => b.id !== blockId);
                saveToLocalStorage();
                renderActiveNote();
            }
        }

        function handleBlockClick(url) {
            if (url) {
                let formattedUrl = url;
                if (!/^https?:\/\//i.test(formattedUrl)) {
                    formattedUrl = 'https://' + formattedUrl;
                }
                window.open(formattedUrl, '_blank');
            }
        }

        // Link Modal Functions
        function openLinkModal(blockId) {
            currentEditingBlockId = blockId;
            const note = getActiveNote();
            const block = note.blocks.find(b => b.id === blockId);
            document.getElementById('linkInput').value = block ? (block.url || '') : '';
            document.getElementById('linkModal').classList.add('open');
        }

        function saveBlockLink() {
            const url = document.getElementById('linkInput').value.trim();
            const note = getActiveNote();
            if (note && currentEditingBlockId) {
                const block = note.blocks.find(b => b.id === currentEditingBlockId);
                if (block) {
                    block.url = url;
                    saveToLocalStorage();
                    renderActiveNote();
                }
            }
            closeModal('linkModal');
        }

        function removeBlockLink() {
            document.getElementById('linkInput').value = '';
            saveBlockLink();
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('open');
        }

        // Share & QR Code Functions with Shortener API
        async function openShareModal() {
            const note = getActiveNote();
            if (!note) return;
            document.getElementById('shareModal').classList.add('open');
            await generateShareUrl();
        }

        async function generateShareUrl() {
            const note = getActiveNote();
            if (!note) return;

            const permission = document.getElementById('sharePermission').value;
            const payload = {
                title: note.title,
                blocks: note.blocks,
                readOnly: (permission === 'view')
            };

            const jsonStr = JSON.stringify(payload);
            const encodedStr = btoa(unescape(encodeURIComponent(jsonStr)));
            const baseUrl = window.location.origin + window.location.pathname;
            const longUrl = `${baseUrl}?shared=${encodedStr}`;

            const inputEl = document.getElementById('shareUrlInput');
            inputEl.value = 'Genererar kort länk...';

            try {
                // Shorten URL using TinyURL API
                const res = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
                if (res.ok) {
                    const shortUrl = await res.text();
                    inputEl.value = shortUrl;
                    generateQRCode(shortUrl);
                } else {
                    inputEl.value = longUrl;
                    generateQRCode(longUrl);
                }
            } catch (e) {
                inputEl.value = longUrl;
                generateQRCode(longUrl);
            }
        }

        function generateQRCode(text) {
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
                text: text,
                width: 160,
                height: 160,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function downloadQRCode() {
            const qrCanvas = document.querySelector('#qrcode canvas');
            const qrImg = document.querySelector('#qrcode img');
            let imgData = '';

            if (qrCanvas) {
                imgData = qrCanvas.toDataURL('image/png');
            } else if (qrImg) {
                imgData = qrImg.src;
            }

            if (imgData) {
                const a = document.createElement('a');
                a.href = imgData;
                a.download = 'anteckning-qr.png';
                a.click();
            }
        }

        function copyShareUrl() {
            const inputEl = document.getElementById('shareUrlInput');
            inputEl.select();
            navigator.clipboard.writeText(inputEl.value);
            alert('Delningslänk kopierad till urklipp!');
        }

        // Backup Export / Import
        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(notes, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `anteckningar_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedNotes = JSON.parse(e.target.result);
                    if (Array.isArray(importedNotes)) {
                        notes = importedNotes;
                        activeNoteId = notes.length > 0 ? notes[0].id : null;
                        saveToLocalStorage();
                        renderNotesList();
                        renderActiveNote();
                        alert('Backup återställd framgångsrikt!');
                    } else {
                        alert('Ogiltigt backupformat.');
                    }
                } catch(err) {
                    alert('Kunde inte läsa backup-filen.');
                }
            };
            reader.readAsText(file);
        }

        // Helper: Escape HTML
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
