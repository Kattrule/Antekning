<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anteckning</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Outfit) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f111a;
            --card-bg: rgba(22, 26, 39, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-neon: #00f2fe;
            --secondary-neon: #4facfe;
            --accent-pink: #ff0844;
            --accent-purple: #b224ef;
            --text-main: #f0f3f8;
            --text-muted: #8c9ba5;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(178, 36, 239, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        #app {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar Navigation */
        aside {
            width: 300px;
            background: rgba(13, 15, 23, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            z-index: 20;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 24px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-neon), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-new-note {
            margin: 20px;
            padding: 12px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #000;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
            transition: all 0.2s;
        }

        .btn-new-note:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.3);
        }

        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 20px;
        }

        .note-item {
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: var(--radius-md);
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .note-item:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .note-item.active {
            background: rgba(0, 242, 254, 0.08);
            border-color: rgba(0, 242, 254, 0.3);
        }

        .note-item-title {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .note-item-delete {
            opacity: 0.7;
            color: var(--text-muted);
            transition: opacity 0.2s, color 0.2s;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }

        .note-item-delete:hover {
            opacity: 1;
            color: var(--accent-pink);
        }

        /* Main Content Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 17, 26, 0.6);
            backdrop-filter: blur(10px);
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .btn-menu-toggle {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 1.1rem;
        }

        .note-title-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.4rem;
            font-weight: 700;
            outline: none;
            width: 100%;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mode-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            padding: 3px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
        }

        .mode-btn {
            padding: 6px 12px;
            border-radius: 20px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            color: #000;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .editor-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
        }

        .blocks-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .block-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .block-item.disabled {
            opacity: 0.5;
            background: rgba(10, 12, 18, 0.5);
        }

        .block-item.disabled .block-text-input {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .checkbox-wrapper input {
            display: none;
        }

        .custom-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .checkbox-wrapper input:checked + .custom-checkbox {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            border-color: transparent;
        }

        .custom-checkbox i {
            color: #fff;
            font-size: 0.75rem;
            display: none;
        }

        .checkbox-wrapper input:checked + .custom-checkbox i {
            display: block;
        }

        .block-text-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .block-view-text {
            flex: 1;
            font-size: 1rem;
            color: var(--text-main);
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .block-view-text.has-link {
            cursor: pointer;
            color: var(--primary-neon);
        }

        .block-view-text.has-link:hover {
            text-decoration: underline;
        }

        .block-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-block-action {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-block-action.active-link {
            color: var(--primary-neon);
        }

        .btn-add-block {
            margin-top: 16px;
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed var(--card-border);
            border-radius: var(--radius-lg);
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #161a27;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 90%;
            max-width: 440px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
        }

        .modal-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 12px;
            color: var(--text-main);
            outline: none;
            margin-bottom: 16px;
        }

        .qr-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 16px 0;
            background: #fff;
            padding: 16px;
            border-radius: var(--radius-md);
            min-height: 180px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            gap: 16px;
            text-align: center;
        }

        @media (max-width: 768px) {
            aside {
                position: absolute;
                top: 0; left: 0; bottom: 0;
                transform: translateX(-100%);
                box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            }
            aside.mobile-open {
                transform: translateX(0);
            }
            .btn-menu-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- Sidebar Navigation -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-note-sticky"></i>
                    <span>Anteckningar</span>
                </div>
                <button class="btn-block-action" onclick="toggleSidebar()" title="Stäng meny">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <button class="btn-new-note" onclick="createNewNote()">
                <i class="fa-solid fa-plus"></i> Ny Anteckning
            </button>
            <div class="notes-list" id="notesList"></div>
        </aside>

        <!-- Main Workspace -->
        <main>
            <header>
                <div class="header-left">
                    <button class="btn-menu-toggle" onclick="toggleSidebar()" title="Visa meny">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <input type="text" id="noteTitle" class="note-title-input" placeholder="Anteckningens titel..." oninput="updateNoteTitle(this.value)">
                </div>

                <div class="toolbar">
                    <button class="btn-icon" onclick="exportBackup()" title="Exportera Backup">
                        <i class="fa-solid fa-download"></i>
                    </button>
                    <button class="btn-icon" onclick="document.getElementById('importFileInput').click()" title="Importera Backup">
                        <i class="fa-solid fa-upload"></i>
                    </button>
                    <input type="file" id="importFileInput" style="display:none" accept=".json" onchange="importBackup(event)">

                    <div class="mode-toggle">
                        <button class="mode-btn active" id="btnModeEdit" onclick="setMode('edit')">
                            <i class="fa-solid fa-pen"></i> Redigera
                        </button>
                        <button class="mode-btn" id="btnModeView" onclick="setMode('view')">
                            <i class="fa-solid fa-eye"></i> Visa
                        </button>
                    </div>

                    <button class="btn-icon" onclick="openShareModal()">
                        <i class="fa-solid fa-share-nodes"></i> Dela
                    </button>
                </div>
            </header>

            <div class="editor-area">
                <div id="blocksContainer" class="blocks-container"></div>
                <button class="btn-add-block" id="btnAddBlock" onclick="addBlock()">
                    <i class="fa-solid fa-plus"></i> Lägg till nytt block
                </button>
            </div>
        </main>
    </div>

    <!-- Link Modal -->
    <div class="modal-overlay" id="linkModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Koppla länk till block</h3>
                <button class="modal-close" onclick="closeModal('linkModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <input type="url" id="linkInput" class="modal-input" placeholder="https://exempel.se">
            <div style="display:flex; justify-content:flex-end; gap:8px;">
                <button class="btn-icon" onclick="removeBlockLink()" style="color:var(--accent-pink);">Ta bort länk</button>
                <button class="btn-icon" onclick="saveBlockLink()" style="background:var(--primary-neon); color:#000;">Spara</button>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div class="modal-overlay" id="shareModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Dela anteckning</h3>
                <button class="modal-close" onclick="closeModal('shareModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div style="margin-bottom:12px;">
                <label style="font-size:0.85rem; color:var(--text-muted); display:block; margin-bottom:4px;">Behörighet</label>
                <select id="sharePermission" class="modal-input" style="margin-bottom:0;" onchange="generateShareUrl()">
                    <option value="view">Endast visa (skrivskyddad)</option>
                    <option value="edit">Kan redigera</option>
                </select>
            </div>

            <div style="margin-bottom:12px;">
                <label style="font-size:0.85rem; color:var(--text-muted); display:block; margin-bottom:4px;">Kort länk</label>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="shareUrlInput" class="modal-input" readonly style="margin-bottom:0;">
                    <button class="btn-icon" onclick="copyShareUrl()"><i class="fa-solid fa-copy"></i></button>
                </div>
            </div>

            <div style="text-align:center;">
                <label style="font-size:0.85rem; color:var(--text-muted);">QR-kod</label>
                <div class="qr-container">
                    <div id="qrcode"></div>
                </div>
                <button class="btn-icon" onclick="downloadQRCode()" style="width:100%; justify-content:center;">
                    <i class="fa-solid fa-file-arrow-down"></i> Ladda ner QR-kod
                </button>
            </div>
        </div>
    </div>

    <script>
        let notes = [];
        let activeNoteId = null;
        let currentMode = 'edit';
        let currentEditingBlockId = null;

        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            checkUrlParams();
            if (!activeNoteId && notes.length > 0) {
                activeNoteId = notes[0].id;
            }
            renderNotesList();
            renderActiveNote();
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('mobile-open');
        }

        function saveToLocalStorage() {
            localStorage.setItem('notepad_pro_data', JSON.stringify(notes));
        }

        function loadFromLocalStorage() {
            const data = localStorage.getItem('notepad_pro_data');
            notes = data ? JSON.parse(data) : [];
        }

        function checkUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const sharedData = urlParams.get('shared');
            if (sharedData) {
                try {
                    const decoded = JSON.parse(decodeURIComponent(escape(atob(sharedData))));
                    const newNote = {
                        id: 'shared_' + Date.now(),
                        title: decoded.title || 'Delad Anteckning',
                        blocks: decoded.blocks || []
                    };
                    notes.unshift(newNote);
                    activeNoteId = newNote.id;
                    saveToLocalStorage();
                    if(decoded.readOnly) setMode('view');
                } catch(e) {
                    console.error('Kunde inte läsa delad länk', e);
                }
            }
        }

        function renderNotesList() {
            const listEl = document.getElementById('notesList');
            listEl.innerHTML = '';
            notes.forEach(note => {
                const item = document.createElement('div');
                item.className = `note-item ${note.id === activeNoteId ? 'active' : ''}`;
                item.onclick = () => { selectNote(note.id); };
                item.innerHTML = `
                    <span class="note-item-title">${escapeHtml(note.title || 'Namnlös anteckning')}</span>
                    <button class="note-item-delete" onclick="deleteNote(event, '${note.id}')"><i class="fa-solid fa-trash"></i></button>
                `;
                listEl.appendChild(item);
            });
        }

        function selectNote(id) {
            activeNoteId = id;
            document.getElementById('sidebar').classList.remove('mobile-open');
            renderNotesList();
            renderActiveNote();
        }

        function createNewNote() {
            const newNote = {
                id: 'n_' + Date.now(),
                title: '',
                blocks: [{ id: 'b_' + Date.now(), text: '', checked: false, url: '' }]
            };
            notes.unshift(newNote);
            activeNoteId = newNote.id;
            saveToLocalStorage();
            renderNotesList();
            renderActiveNote();
            setMode('edit');
        }

        function deleteNote(e, id) {
            e.stopPropagation();
            if (confirm('Ta bort anteckningen?')) {
                notes = notes.filter(n => n.id !== id);
                activeNoteId = notes.length > 0 ? notes[0].id : null;
                saveToLocalStorage();
                renderNotesList();
                renderActiveNote();
            }
        }

        function getActiveNote() {
            return notes.find(n => n.id === activeNoteId);
        }

        function renderActiveNote() {
            const note = getActiveNote();
            const container = document.getElementById('blocksContainer');
            const titleInput = document.getElementById('noteTitle');
            const btnAddBlock = document.getElementById('btnAddBlock');

            if (!note) {
                titleInput.value = '';
                titleInput.disabled = true;
                container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-note-sticky" style="font-size:3rem;"></i><p>Ingen anteckning vald.</p></div>`;
                btnAddBlock.style.display = 'none';
                return;
            }

            titleInput.disabled = (currentMode === 'view');
            titleInput.value = note.title;
            btnAddBlock.style.display = (currentMode === 'edit') ? 'flex' : 'none';
            container.innerHTML = '';

            const blocksToRender = note.blocks.filter(b => !(currentMode === 'view' && b.checked));

            blocksToRender.forEach(block => {
                const blockEl = document.createElement('div');
                blockEl.className = `block-item ${block.checked ? 'disabled' : ''}`;

                if (currentMode === 'edit') {
                    blockEl.innerHTML = `
                        <label class="checkbox-wrapper">
                            <input type="checkbox" ${block.checked ? 'checked' : ''} onchange="toggleBlockCheck('${block.id}', this.checked)">
                            <div class="custom-checkbox"><i class="fa-solid fa-check"></i></div>
                        </label>
                        <input type="text" class="block-text-input" value="${escapeHtml(block.text)}" placeholder="Skriv text..." oninput="updateBlockText('${block.id}', this.value)">
                        <div class="block-controls">
                            <button class="btn-block-action ${block.url ? 'active-link' : ''}" onclick="openLinkModal('${block.id}')"><i class="fa-solid fa-link"></i></button>
                            <button class="btn-block-action" onclick="moveBlock('${block.id}', -1)"><i class="fa-solid fa-arrow-up"></i></button>
                            <button class="btn-block-action" onclick="moveBlock('${block.id}', 1)"><i class="fa-solid fa-arrow-down"></i></button>
                            <button class="btn-block-action" onclick="deleteBlock('${block.id}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                } else {
                    const hasLink = Boolean(block.url);
                    blockEl.innerHTML = `
                        <div class="block-view-text ${hasLink ? 'has-link' : ''}" onclick="handleBlockClick('${block.url}')">
                            <span>${escapeHtml(block.text) || '<i>Tom rad</i>'}</span>
                            ${hasLink ? '<i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.8rem;"></i>' : ''}
                        </div>
                    `;
                }
                container.appendChild(blockEl);
            });
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnModeEdit').classList.toggle('active', mode === 'edit');
            document.getElementById('btnModeView').classList.toggle('active', mode === 'view');
            renderActiveNote();
        }

        function updateNoteTitle(v) {
            const n = getActiveNote();
            if (n) { n.title = v; saveToLocalStorage(); renderNotesList(); }
        }

        function addBlock() {
            const n = getActiveNote();
            if (n) {
                n.blocks.push({ id: 'b_' + Date.now(), text: '', checked: false, url: '' });
                saveToLocalStorage();
                renderActiveNote();
            }
        }

        function updateBlockText(id, text) {
            const n = getActiveNote();
            if (n) {
                const b = n.blocks.find(x => x.id === id);
                if (b) { b.text = text; saveToLocalStorage(); }
            }
        }

        function toggleBlockCheck(id, checked) {
            const n = getActiveNote();
            if (n) {
                const b = n.blocks.find(x => x.id === id);
                if (b) { b.checked = checked; saveToLocalStorage(); renderActiveNote(); }
            }
        }

        function moveBlock(id, dir) {
            const n = getActiveNote();
            if (n) {
                const idx = n.blocks.findIndex(x => x.id === id);
                if (idx < 0) return;
                const newIdx = idx + dir;
                if (newIdx >= 0 && newIdx < n.blocks.length) {
                    const temp = n.blocks[idx];
                    n.blocks[idx] = n.blocks[newIdx];
                    n.blocks[newIdx] = temp;
                    saveToLocalStorage();
                    renderActiveNote();
                }
            }
        }

        function deleteBlock(id) {
            const n = getActiveNote();
            if (n) {
                n.blocks = n.blocks.filter(x => x.id !== id);
                saveToLocalStorage();
                renderActiveNote();
            }
        }

        function handleBlockClick(url) {
            if (url) {
                let formatted = /^https?:\/\//i.test(url) ? url : 'https://' + url;
                window.open(formatted, '_blank');
            }
        }

        function openLinkModal(id) {
            currentEditingBlockId = id;
            const n = getActiveNote();
            const b = n.blocks.find(x => x.id === id);
            document.getElementById('linkInput').value = b ? (b.url || '') : '';
            document.getElementById('linkModal').classList.add('open');
        }

        function saveBlockLink() {
            const url = document.getElementById('linkInput').value.trim();
            const n = getActiveNote();
            if (n && currentEditingBlockId) {
                const b = n.blocks.find(x => x.id === currentEditingBlockId);
                if (b) { b.url = url; saveToLocalStorage(); renderActiveNote(); }
            }
            closeModal('linkModal');
        }

        function removeBlockLink() {
            document.getElementById('linkInput').value = '';
            saveBlockLink();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('open');
        }

        async function openShareModal() {
            const n = getActiveNote();
            if (!n) return;
            document.getElementById('shareModal').classList.add('open');
            await generateShareUrl();
        }

        async function generateShareUrl() {
            const n = getActiveNote();
            if (!n) return;

            const perm = document.getElementById('sharePermission').value;
            const payload = { title: n.title, blocks: n.blocks, readOnly: (perm === 'view') };
            const jsonStr = JSON.stringify(payload);
            const encodedStr = btoa(unescape(encodeURIComponent(jsonStr)));
            const longUrl = `${window.location.origin}${window.location.pathname}?shared=${encodedStr}`;

            const input = document.getElementById('shareUrlInput');
            input.value = 'Skapar kort länk...';

            try {
                const res = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(longUrl)}`);
                const data = await res.json();
                if (data.shorturl) {
                    input.value = data.shorturl;
                    generateQRCode(data.shorturl);
                } else {
                    input.value = longUrl;
                    generateQRCode(longUrl);
                }
            } catch(e) {
                input.value = longUrl;
                generateQRCode(longUrl);
            }
        }

        function generateQRCode(text) {
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            new QRCode(container, {
                text: text,
                width: 160,
                height: 160,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        function downloadQRCode() {
            const canvas = document.querySelector('#qrcode canvas');
            const img = document.querySelector('#qrcode img');
            const src = canvas ? canvas.toDataURL('image/png') : (img ? img.src : '');
            if (src) {
                const a = document.createElement('a');
                a.href = src;
                a.download = 'anteckning-qr.png';
                a.click();
            }
        }

        function copyShareUrl() {
            const input = document.getElementById('shareUrlInput');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert('Länken har kopierats!');
        }
